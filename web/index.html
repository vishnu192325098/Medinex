<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medinex — Intelligent Medicine Management System</title>
  <meta name="description" content="Medinex is an AI-powered healthcare companion to manage medicines, reminders, prescription scanning, stock prediction, interactions, and health wellness.">
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Tesseract.js for high-fidelity in-browser OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body>

  <!-- Root Application Container -->
  <div id="app-root">

    <!-- Top Desktop Control Bar (Device Switcher & Live Clock) -->
    <header class="desktop-bar" role="banner">
      <div class="brand-badge">
        <img src="./assets/logo.png" alt="Medinex Logo" style="width: 22px; height: 22px; border-radius: 6px;">
        <span>MEDINEX WEB</span>
      </div>
      <div class="controls-group">
        <button id="viewToggleBtn" class="btn-ctrl" title="Toggle between smartphone and desktop width">
          <span id="viewToggleIcon">📱</span> <span id="viewToggleLabel">Mobile View</span>
        </button>
        <button id="soundToggleBtn" class="btn-ctrl" title="Toggle audio chimes for reminders">
          <span>🔔</span> Audio Enabled
        </button>
      </div>
    </header>

    <!-- Main Device Shell Frame -->
    <main class="device-frame" id="deviceFrame" role="main">

      <!-- Ambient Background Layer -->
      <div class="bg-ambient-layer" aria-hidden="true"></div>

      <!-- Container where screens are dynamically rendered -->
      <div id="screenContainer" style="width: 100%; flex: 1; display: flex; flex-direction: column;">
        <!-- Injected via app.js -->
      </div>

      <!-- Android Bottom Navigation Bar -->
      <nav id="bottomNavBar" class="bottom-nav-bar" style="display: none;" aria-label="Bottom Navigation">
        <button class="nav-item active" data-screen="dashboard" id="navDashboardBtn">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
          </div>
          <span>Home</span>
        </button>

        <button class="nav-item" data-screen="upload" id="navUploadBtn">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
          </div>
          <span>Scan</span>
        </button>

        <button class="nav-item" data-screen="reminder_setup" id="navRemindersBtn">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
            </svg>
          </div>
          <span>Reminders</span>
        </button>

        <button class="nav-item" data-screen="health_hub" id="navHubBtn">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
            </svg>
          </div>
          <span>Hub</span>
        </button>

        <button class="nav-item" data-screen="profile" id="navProfileBtn">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <span>Profile</span>
        </button>
      </nav>

    </main>

  </div>

  <!-- Android Toast Notification Popup -->
  <div id="androidToast" class="android-toast" role="status" aria-live="polite"></div>

  <!-- Audio Chime Element for Reminders -->
  <audio id="reminderChime" preload="auto" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVoGAACBhYqFbF1fdJivrJBhNjVgodDbqWE2Mmih2+ewfUQ3Vp7P3bFzRzpdpM/dsXNGOl2kz92xc0c6XaTP3bFzRzpdpM/dsXNGOl2kz92xc0c6XaTP3bFzRzpdpM/dsXNGOl2kz92xc0c6XaTP3bFzRzpd"></audio>

  <!-- Main Application Script -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
